name: Build signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate release keystore automatically
        run: |
          keytool -genkeypair -v \
            -keystore app/release.jks \
            -alias joyctl \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=JoyCtl, OU=JoyCtl, O=JoyCtl, L=City, S=State, C=US"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: joyctl
          ANDROID_KEY_PASSWORD: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          NAME="${GITHUB_REF_NAME:-manual}"
          SAFE_NAME=$(printf '%s' "$NAME" | tr '/' '-')
          cp app/build/outputs/apk/release/app-release.apk "JoyCtl-Android-${SAFE_NAME}.apk"
          ls -l JoyCtl-Android-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyCtl-Android
          path: JoyCtl-Android-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: JoyCtl-Android-*.apk
          generate_release_notes: true
